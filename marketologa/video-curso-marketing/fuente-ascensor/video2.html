 if(o.bub){o.b=h('div','bub frost '+(o.side=='left'?'l':'r'),'');(o.layer=='over'?$('#over'):$('#chars')).appendChild(o.b)}APP.push(o);return o}

 if(l<0||(o.t1!=null&&t>o.t1+.6)){e.style.opacity=0;if(o.b)o.b.style.opacity=0;return}

 r.app.t1=r.end});
// grupo (título y cierre) como el flyer
const GROUP=[['pink',880,0,430],['green',640,215,500],['blue',650,610,470],['speck',700,760,600],['orange',560,20,850],['purple',520,600,900]];
const T=scenes[1],FN=scenes[scenes.length-1];
GROUP.forEach((g,i)=>addChar({k:g[0],h:g[1],x:g[2],y:g[3],t0:T.start+.12+i*.09,t1:T.end,re:[T.tMk,T.tTodo],side:g[2]<400?'left':'right'}));
GROUP.forEach((g,i)=>addChar({k:g[0],h:g[1]*.92,x:g[2]+10,y:g[3]+60,t0:FN.start+.15+i*.09,t1:null,re:[FN.t8,FN.tSum],side:g[2]<400?'left':'right'}));
// orden de profundidad del grupo
APP.forEach(o=>{if(o.k=='green'||o.k=='blue'){if(o.layer!='over')o.e.style.zIndex=1}else o.e.style.zIndex=2});
const KW=TL.kw.concat(scenes.filter(s=>s.chips).flatMap(s=>s.chips.map(c=>({k:c.k[0].toUpperCase()+c.k.slice(1),t:c.t})))).sort((a,b)=>a.t-b.t);
function doorAt(t){let d=0;TL.doors.forEach(([a,b,c,e])=>{if(t>=a&&t<=e){const v=t<b?eio((t-a)/(b-a)):t<c?1:1-eio((t-c)/(e-c));d=Math.max(d,v)}});return d}
function seek(t){
 ['#rf1','#rf2','#rf3','#rf4','#rf5'].forEach((s,i)=>{$(s).style.transform=`translate(${Math.sin(t*.5+i)*30}px,${Math.cos(t*.4+i*2)*26}px)`});
 const D=doorAt(t);$('#dl').style.transform=`translateX(${-(1-D)*101}%)`;$('#dr').style.transform=`translateX(${(1-D)*101}%)`;
 $('#doors').style.visibility=D>0.001?'visible':'hidden';
 let cur=null;
 scenes.forEach((sc,si)=>{const el=sc.el,end=sc.end;
  if(t<sc.start-0.01||t>end+0.45){el.style.display='none';return}
  el.style.display='block';if(t>=sc.start&&t<end)cur=sc;
  const ex=cl((t-end)/.4),en=cl((t-sc.start)/.3);
  if(sc.kind=='hook'){const q=cl((t-end)/.25);el.style.opacity=1-q;el.style.filter='none';el.style.transform=`scale(${1+q*.15})`}
  const doorSwap=sc.kind!='hook'&&TL.doors.some(d=>Math.abs(d[1]-end)<.05||Math.abs(d[2]-end)<.6&&sc.kind=='break');
  if(sc.kind!='hook'){el.style.opacity=(sc.kind=='cards'?1:en)*(doorSwap?(t>end+0.02?0:1):1-ex);
  el.style.filter=(!doorSwap&&ex>0)?`blur(${ex*14}px)`:'none';
  el.style.transform=doorSwap?'none':`translateY(${-ex*60}px) scale(${1-ex*.08})`;}
  const lt=t-sc.start;
  if(sc.cs)sc.cs.forEach(c=>{const l=t-c.t;if(l<0){c.e.style.opacity=0;return}const p=eback(l/.55);const[x,y,s]=c.L;c.e.style.opacity=cl(l/.16);c.e.style.transform=`translate(${x}px,${y+(1-p)*90+Math.sin(t*1.2+c.p)*3}px) scale(${s*(.72+.28*p)}) rotate(${(1-p)*-5}deg)`;animCard(c.e,l)});
  if(sc.kind=='hook'){const h5=sc.h50;const p0=eback((t-sc.t50)/.6);h5.style.opacity=cl((t-sc.t50)/.15);h5.style.transform=`scale(${.5+.5*p0})`;
   const n=Math.round(50*eo((t-sc.t50)/.9));h5.querySelectorAll('span').forEach(s=>s.textContent=Math.max(0,n));
   const p1=eback((t-sc.tTemas)/.5);$('#htm').style.opacity=cl((t-sc.tTemas)/.15);$('#htm').style.transform=`translateY(${(1-p1)*80}px) scale(${.8+.2*p1})`;
   const p2=eback((t-sc.tImp+.15)/.5);$('#himp').style.opacity=cl((t-sc.tImp+.15)/.15);$('#himp').style.transform=`scale(${.7+.3*p2})`}
  if(sc.kind=='title'){const a=eback((lt-.2)/.45);$('#tt1').style.opacity=cl((lt-.2)/.12);$('#tt1').style.transform=`translateY(${(1-a)*-60}px)`;
   const b=espring((t-sc.tMk+.12)/.9);$('#tt2').style.opacity=cl((t-sc.tMk+.12)/.12);$('#tt2').style.transform=`scale(${.5+.5*b})`;
   const c=eback((t-sc.tTodo+.05)/.45);$('#tt3').style.opacity=cl((t-sc.tTodo+.05)/.12);$('#tt3').style.transform=`translateX(${(1-c)*-200}px)`}
  if(sc.kind=='break'){const p1=eo((lt-.35)/.4);el.querySelector('.b1').style.opacity=p1;el.querySelector('.b1').style.transform=`translateY(${(1-p1)*40}px)`;
   const p2=eback((t-sc.tIn+.1)/.55);const b2=el.querySelector('.b2');b2.style.opacity=cl((t-sc.tIn+.1)/.12);b2.style.transform=`scale(${.5+.5*p2})`;
   el.querySelectorAll('.spark').forEach(e=>{const k=+e.dataset.k,a=k/10*Math.PI*2+.3,q=eo((t-sc.tIn)/1.1),r=lerp(60,330+(k%3)*50,q);e.style.left=(520+Math.cos(a)*r*1.35)+'px';e.style.top=(330+Math.sin(a)*r*.8)+'px';e.style.opacity=cl((t-sc.tIn)/.1)*(1-cl((t-sc.tIn-1.1)/.5));e.style.transform=`rotate(${lt*90+k*30}deg)`});
   if(sc.rec){const r=el.querySelector('.brec');r.style.opacity=cl((lt-.4)/.2);r.querySelector('.rd').style.opacity=(Math.floor(t*2.5)%2)?1:.25;r.lastChild.textContent='REC 00:0'+Math.floor(lt)}
   if(sc.bc){const c=sc.bc,l=t-c.t;if(l<0)c.e.style.opacity=0;else{const p=eback(l/.55);c.e.style.opacity=cl(l/.16);c.e.style.transform=`translate(${600}px,${640+(1-p)*90}px) scale(${.92*(.7+.3*p)}) rotate(${(1-p)*8+3}deg)`;animCard(c.e,l)}}}
  if(sc.kind=='final'){const p8=eback((t-sc.t8+.1)/.5);$('#f8').style.opacity=cl((t-sc.t8+.1)/.15);$('#f8').style.transform=`scale(${.6+.4*p8})`;$('#f8').querySelectorAll('.g span').forEach(s=>s.textContent=Math.max(1,Math.round(8*eo((t-sc.t8+.1)/.7))));
   const tt=[sc.tA,sc.tP,sc.tAct];el.querySelectorAll('.fch').forEach((e,i)=>{const q=eback((t-tt[i]+.1)/.45);e.style.opacity=cl((t-tt[i]+.1)/.15);e.style.transform=`translateY(${(1-q)*50}px) scale(${.7+.3*q})`});
   const pb=eback((t-sc.tSum+.25)/.55);$('#fbtn').style.opacity=cl((t-sc.tSum+.25)/.15);const press=(t>sc.tSum+.35&&t<sc.tSum+.55)?.94:1;$('#fbtn').style.transform=`scale(${(.6+.4*pb)*press*(1+Math.sin(t*5)*.012*cl(t-sc.tSum-.6))})`;
   const pc=eo((t-sc.tSum)/.4);$('#fcur').style.left=lerp(1000,700,pc)+'px';$('#fcur').style.top=lerp(1340,1190,pc)+'px';$('#fcur').style.opacity=cl((t-sc.tSum)/.15);
   const rq=cl((t-sc.tSum-.45)/.6);$('#frip').style.left='700px';$('#frip').style.top='1190px';$('#frip').style.opacity=rq>0&&rq<1?1-rq:0;$('#frip').style.transform=`scale(${1+rq*6})`}
 });
 APP.forEach(o=>animChar(o,t));
 // indicador de piso
 let lastc=null;runs.forEach(r=>r.cards.forEach(c=>{if(t>=c.t&&(!lastc||c.t>=lastc.t))lastc=c}));scenes.forEach(s=>{if(s.bc&&t>=s.bc.t&&(!lastc||s.bc.t>=lastc.t))lastc=s.bc});
 const curRun=runs.find(r=>t>=r.start-.35&&t<r.end);
 const sec=curRun?SECS[curRun.sec]:(lastc?SECS[PG[lastc.p].s]:null);
 setVars($('#hdr'),sec||DEF);
 const k=cur?cur.kind:'hook';
 if(k=='hook'){$('#fnum').textContent='50';$('#fname').textContent='TEMAS';$('#ftema').textContent='MARKETING';$('#arrow').textContent='▲'}
 else if(k=='title'){$('#fnum').textContent='PB';$('#fname').textContent='TODO EN UNO';$('#ftema').textContent='50 TEMAS'}
 else if(k=='final'){$('#fnum').textContent='✓';$('#fname').textContent='8 HORAS';$('#ftema').textContent='50/50'}
 else if(k=='break'){$('#fnum').textContent='··';$('#fname').textContent=cur.big2.toUpperCase();$('#ftema').textContent=lastc?`TEMA ${String(lastc.p).padStart(2,'0')}/50`:''}
 else if(curRun){$('#fnum').textContent=String(curRun.sec+1).padStart(2,'0');$('#fname').textContent=SECS[curRun.sec].n;$('#ftema').textContent=lastc?`TEMA ${String(lastc.p).padStart(2,'0')}/50`:''}
 $('#arrow').style.transform=`translateY(${D>0?Math.sin(t*10)*4:0}px)`;$('#arrow').style.opacity=D>0||k=='break'?1:.55;
 if(lastc){const l=t-lastc.t;$('#ftema').style.transform=`scale(${1+.16*Math.exp(-l*8)})`}
 // palabra clave
 let kk=null;KW.forEach(x=>{if(t>=x.t-.05)kk=x});const kp=$('#kwp');
 const on=cur&&cur.kind=='cards'&&kk&&kk.t>=cur.start-.3&&curRun;
 if(on){const l=t-kk.t+.05,p=eback(l/.4);setVars(kp,sec);$('#kwt').textContent=kk.k;
  const w=kp.offsetWidth,z0=curRun.side=='left'?curRun.cw+24:0,z1=curRun.side=='left'?1080:1080-curRun.cw-24;
  kp.style.left=Math.max(z0,(z0+z1)/2-w/2)+'px';kp.style.opacity=cl(l/.1);kp.style.transform=`scale(${.75+.25*p}) rotate(${(1-p)*-4}deg)`}else kp.style.opacity=0;
}
window.seek=seek;
</script></body></html>
